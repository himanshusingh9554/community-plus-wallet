version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: community_wallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      target: backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/community_wallet
      JWT_SECRET: dev-secret-change-in-production
      OTP_FIXED: '123456'
      PENDING_TTL_SECONDS: '86400'
      NOTIFY_URL: http://notify:4001/notify
      PORT: '4000'
      NODE_ENV: production
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma migrate deploy && node prisma/seed.js && node src/server.js"

  frontend:
    image: nginx:alpine
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  pgdata:
