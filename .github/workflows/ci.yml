name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Backend & Concurrency Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: community_wallet_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        run: npm ci
        working-directory: backend

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: backend

      - name: Synchronize Database Schema
        run: npx prisma db push --skip-generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/community_wallet_test

      - name: Seed Demo & RBAC Accounts
        run: node prisma/seed.js
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/community_wallet_test

      - name: Install Test Dependencies
        run: npm ci
        working-directory: tests

      - name: Execute Full Test Suite (Unit, Integration & Concurrency)
        run: npm test
        working-directory: tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/community_wallet_test
          JWT_SECRET: community-wallet-ci-secret-2024
          OTP_FIXED: '123456'
          NODE_ENV: test
          LOG_LEVEL: error

  build-frontend:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Frontend Application
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:4000
